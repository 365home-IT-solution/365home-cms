name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [master, production]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, xml, bcmath, curl, zip
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-all --ansi

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --ansi

      - name: Check PHP syntax
        run: find app Modules database config -name "*.php" -print0 | xargs -0 php -l | grep -v "No syntax errors" || true

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate --ansi

      - name: Check artisan boots
        run: php artisan --version
