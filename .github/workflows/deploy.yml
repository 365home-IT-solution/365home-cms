name: Deploy to Production

on:
  push:
    branches: [production]

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, xml, bcmath, curl, zip
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-all --ansi

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --ansi

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate --ansi

      - name: Check PHP syntax
        run: find app Modules database config -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Check artisan boots
        run: php artisan --version

  # Build image trên runner GitHub rồi đẩy lên GHCR — VPS chỉ pull image về, không build tại chỗ
  # (npm ci + 3 lần vite build + composer trên VPS 4GB ăn hết RAM, app đang chạy bị OOM → 502).
  build:
    needs: check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # VITE_REVERB_* được bake vào JS lúc build (xem Dockerfile stage frontend) — trước đây compose
      # lấy từ .env trên VPS, giờ lấy từ Repository variables (Settings → Secrets and variables →
      # Actions → Variables), giá trị copy y hệt .env production.
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/365home-it-solution/365home-cms:production
            ghcr.io/365home-it-solution/365home-cms:${{ github.sha }}
          build-args: |
            VITE_REVERB_APP_KEY=${{ vars.REVERB_APP_KEY }}
            VITE_REVERB_HOST=${{ vars.VITE_REVERB_HOST }}
            VITE_REVERB_PORT=${{ vars.VITE_REVERB_PORT }}
            VITE_REVERB_SCHEME=${{ vars.VITE_REVERB_SCHEME }}
            VITE_REVERB_PATH=${{ vars.VITE_REVERB_PATH }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            mkdir -p /home/dev/www
            if [ ! -d /home/dev/www/365home.vn/.git ]; then
              git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/365home-IT-solution/365home-cms.git /home/dev/www/365home.vn
            fi
            cd /home/dev/www/365home.vn
            git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/365home-IT-solution/365home-cms.git
            git fetch origin
            git checkout -f production
            sudo chown -R $(whoami):$(whoami) /home/dev/www/365home.vn/storage/ /home/dev/www/365home.vn/bootstrap/cache/ 2>/dev/null || true
            git reset --hard origin/production
            sudo chown -R www-data:www-data /home/dev/www/365home.vn/storage/ /home/dev/www/365home.vn/bootstrap/cache/ 2>/dev/null || true
            sudo chmod -R 775 /home/dev/www/365home.vn/storage/ /home/dev/www/365home.vn/bootstrap/cache/ 2>/dev/null || true
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull app
            docker logout ghcr.io
            docker compose up -d --no-build
            docker image prune -f
            pm2 startOrReload /home/dev/www/365home.vn/websocket/ecosystem.config.js --update-env
            pm2 save
            echo "Deploy $(date '+%Y-%m-%d %H:%M') OK"
