name: Deploy to Production

on:
  push:
    branches: [production]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, xml, bcmath, curl, zip
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-all --ansi

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --ansi

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate --ansi

      - name: Check PHP syntax
        run: find app Modules database config -name "*.php" -print0 | xargs -0 php -l | grep -v "No syntax errors" || true

      - name: Check artisan boots
        run: php artisan --version

  deploy:
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /home/dev/www/365home
            git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/365home-IT-solution/365home-cms.git
            git pull origin production
            rm -f bootstrap/cache/config.php bootstrap/cache/packages.php bootstrap/cache/services.php
            composer install --no-dev --optimize-autoloader
            php artisan optimize:clear
            php artisan package:discover --ansi
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan migrate --force
            echo "Deploy $(date '+%Y-%m-%d %H:%M') OK"
