name: Deploy to Production

on:
  push:
    branches: [production]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: 365home-it-solution/365home-cms

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, xml, bcmath, curl, zip
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-all --ansi

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --ansi

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate --ansi

      - name: Check PHP syntax
        run: find app Modules database config -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Check artisan boots
        run: php artisan --version

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            VITE_REVERB_APP_KEY=${{ secrets.VITE_REVERB_APP_KEY }}
            VITE_REVERB_HOST=${{ secrets.VITE_REVERB_HOST }}
            VITE_REVERB_PORT=${{ secrets.VITE_REVERB_PORT }}
            VITE_REVERB_SCHEME=${{ secrets.VITE_REVERB_SCHEME }}
            VITE_REVERB_PATH=${{ secrets.VITE_REVERB_PATH }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: IMAGE_TAG,REGISTRY,GITHUB_TOKEN,GITHUB_ACTOR
          env_file: /dev/null
          script: |
            set -e
            IMAGE_TAG="${{ needs.build.outputs.image_tag }}"
            REGISTRY="${{ env.REGISTRY }}"
            GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"
            GITHUB_ACTOR="${{ github.actor }}"

            mkdir -p /home/dev/www
            if [ ! -d /home/dev/www/365home.vn/.git ]; then
              git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/365home-IT-solution/365home-cms.git /home/dev/www/365home.vn
            fi

            cd /home/dev/www/365home.vn
            git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/365home-IT-solution/365home-cms.git
            git fetch origin
            git checkout production
            git reset --hard origin/production

            # Login to GHCR và pull image
            echo "$GITHUB_TOKEN" | docker login $REGISTRY -u "$GITHUB_ACTOR" --password-stdin
            docker pull $IMAGE_TAG

            # Deploy với compose.prod.yaml (sử dụng pre-built image)
            DOCKER_IMAGE=$IMAGE_TAG docker compose -f compose.prod.yaml up -d

            # Cleanup
            docker logout $REGISTRY || true

            # Start/Reload websocket
            pm2 startOrReload /home/dev/www/365home.vn/websocket/ecosystem.config.js --update-env
            pm2 save

            echo "Deploy $(date '+%Y-%m-%d %H:%M') OK"
