services:
    app:
        image: ${DOCKER_IMAGE:-ghcr.io/365home-it-solution/365home-cms:latest}
        restart: unless-stopped
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
        volumes:
            - './storage:/var/www/html/storage'
        env_file: .env
        dns:
            - 8.8.8.8
            - 8.8.4.4
        networks:
            - app
            - mariadb_default
        depends_on:
            - redis

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        networks:
            - app

    reverb:
        image: ${DOCKER_IMAGE:-ghcr.io/365home-it-solution/365home-cms:latest}
        restart: unless-stopped
        command: php artisan reverb:start --host=0.0.0.0 --port=6001
        ports:
            - '6001:6001'
        env_file: .env
        networks:
            - app
            - mariadb_default
        depends_on:
            - redis

networks:
    app:
        driver: bridge
    mariadb_default:
        external: true
