# =====================================================================================
# coturn — TURN/STUN cho gọi thoại mini game (WebRTC), xem App\Services\GameVoiceService
#
# Cài (Ubuntu):  sudo apt install coturn  →  chép file này vào /etc/turnserver.conf  →  sửa các dòng có "SỬA"
#                sudo sed -i 's/^#TURNSERVER_ENABLED=1/TURNSERVER_ENABLED=1/' /etc/default/coturn
#                sudo systemctl enable --now coturn
# Mở tường lửa:  3478/udp, 3478/tcp, 5349/tcp (TLS), 49152-65535/udp (dải relay — khớp min-port/max-port bên dưới)
# Laravel:       nhập ở CMS (Quản lý API → Mini game — Chat → Máy chủ TURN) HOẶC .env — CMS được ưu tiên:
#                TURN_URLS=turn:turn.365home.vn:3478?transport=udp,turn:turn.365home.vn:3478?transport=tcp,turns:turn.365home.vn:5349?transport=tcp
#                STUN_URLS=stun:turn.365home.vn:3478
#                TURN_SECRET=<đúng giá trị static-auth-secret bên dưới> (CMS có nút tạo khoá ngẫu nhiên)
# Kiểm tra:      https://webrtc.github.io/samples/src/content/peerconnection/trickle-ice/ — nhập turn:… + username/credential lấy từ
#                POST /api/games/tien-len/rooms/{id}/voice (ice_servers), bấm Gather: phải thấy candidate loại "relay".
# =====================================================================================

listening-port=3478
tls-listening-port=5349

# SỬA: IP public của máy chủ (máy sau NAT / cloud có IP nội bộ: external-ip=IP_PUBLIC/IP_NỘI_BỘ)
external-ip=203.0.113.10

# Dải cổng relay: mỗi kết nối đi qua TURN giữ 1 cổng / người / người đối diện (phòng 4 người đi relay hết ≈ 12 cổng).
# 16.384 cổng ≈ 1.300 phòng 4 người cùng lúc đi relay — dư cho nhu cầu thật.
min-port=49152
max-port=65535

# SỬA: tên miền TURN
realm=turn.365home.vn
server-name=turn.365home.vn

# Mật khẩu có hạn theo chuẩn TURN REST API — Laravel ký username "{hết hạn}:{nhãn}" bằng khoá này (HMAC-SHA1).
# SỬA: chuỗi ngẫu nhiên dài (vd: openssl rand -hex 32), giống TURN_SECRET trong .env Laravel. KHÔNG dùng user/password cố định.
use-auth-secret
static-auth-secret=THAY_BANG_CHUOI_NGAU_NHIEN_DAI

# SỬA: chứng chỉ TLS cho turns: (dùng chung chứng chỉ Let's Encrypt của tên miền)
cert=/etc/letsencrypt/live/turn.365home.vn/fullchain.pem
pkey=/etc/letsencrypt/live/turn.365home.vn/privkey.pem
no-tlsv1
no-tlsv1_1

fingerprint
no-cli
no-multicast-peers
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780

# Giới hạn tài nguyên: gọi thoại chỉ cần audio (~40–50 kbps / luồng).
# total-quota: tổng số phiên relay cùng lúc trên máy (chặn quá tải băng thông); user-quota: theo 1 vé (1 người trong 1 phòng,
# tối đa 3 người đối diện × 3 địa chỉ TURN = 9 phiên lúc dò đường). max-bps: trần băng thông 1 phiên (audio dùng ~50 kbps).
total-quota=3000
user-quota=12
max-bps=128000
stale-nonce=600

# BẢO MẬT: không cho TURN chuyển tiếp vào mạng nội bộ / localhost của máy chủ (chống dùng TURN dò mạng trong)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

log-file=/var/log/turnserver/turnserver.log
simple-log
