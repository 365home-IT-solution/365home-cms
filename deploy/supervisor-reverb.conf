; Copy file này vào /etc/supervisor/conf.d/reverb.conf trên server production, SỬA lại 3 chỗ
; "/đường-dẫn-thật" thành đường dẫn thật của project, rồi chạy:
;   supervisorctl reread && supervisorctl update && supervisorctl start reverb
[program:reverb]
command=php /đường-dẫn-thật/artisan reverb:start --host=0.0.0.0 --port=6001
directory=/đường-dẫn-thật
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/đường-dẫn-thật/storage/logs/reverb.log
