# Include file này vào ĐÚNG block "server { listen 443 ssl; ... }" của site production
# (thêm 1 dòng: include /đường-dẫn-thật/deploy/nginx-reverb.conf; vào bên trong block đó).
#
# Reverb LUÔN chạy plain nội bộ (không tự cầm TLS) — Nginx đảm nhận TLS/WSS công khai rồi forward
# vào Reverb qua REVERB_SERVER_PORT (mặc định 6001, khớp với .env REVERB_SERVER_PORT).
location /app/ {
    proxy_pass http://127.0.0.1:6001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
}

location /apps/ {
    proxy_pass http://127.0.0.1:6001;
}
