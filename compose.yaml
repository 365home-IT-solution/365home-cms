services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: '365home/app:latest'
        restart: unless-stopped
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
        volumes:
            - './storage:/var/www/html/storage'
        env_file: .env
        networks:
            - app

networks:
    app:
        driver: bridge
