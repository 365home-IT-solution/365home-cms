services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                VITE_REVERB_APP_KEY: ${REVERB_APP_KEY}
                VITE_REVERB_HOST: ${VITE_REVERB_HOST}
                VITE_REVERB_PORT: ${VITE_REVERB_PORT}
                VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME}
                VITE_REVERB_PATH: ${VITE_REVERB_PATH}
        # Image build sẵn trên GitHub Actions (deploy.yml) rồi đẩy lên GHCR — server chỉ pull, không
        # build tại chỗ (build trên VPS 4GB ăn hết RAM, app đang chạy bị OOM → 502). Local vẫn
        # "docker compose build" được nhờ khối build: phía trên.
        image: 'ghcr.io/365home-it-solution/365home-cms:${IMAGE_TAG:-production}'
        restart: unless-stopped
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
        volumes:
            - './storage:/var/www/html/storage'
            # vietnam.pmtiles (~1.2GB) bị .gitignore — image build trên GitHub Actions không có file
            # này, phải mount từ thư mục source trên VPS vào (MAP_PMTILES_URL=/maps/vietnam.pmtiles).
            - './public/maps:/var/www/html/public/maps:ro'
        env_file: .env
        dns:
            - 8.8.8.8
            - 8.8.4.4
        networks:
            - app
            - mariadb_default
        depends_on:
            - redis

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        # Lưu bền vững (AOF) + volume đặt tên riêng: nếu không có, dữ liệu Redis (cache, session,
        # access_token/refresh_token Zalo OA...) chỉ sống trong writable layer của container và mất
        # sạch mỗi khi container này bị tạo lại (vd VPS restart, docker compose down/up lại toàn bộ
        # stack) — đây là nguyên nhân gây mất token Zalo dẫn tới gửi OTP lỗi liên tục sau sự cố đó.
        command: redis-server --appendonly yes
        volumes:
            - 'redis-data:/data'
        networks:
            - app

    reverb:
        # Image build sẵn trên GitHub Actions (deploy.yml) rồi đẩy lên GHCR — server chỉ pull, không
        # build tại chỗ (build trên VPS 4GB ăn hết RAM, app đang chạy bị OOM → 502). Local vẫn
        # "docker compose build" được nhờ khối build: phía trên.
        image: 'ghcr.io/365home-it-solution/365home-cms:${IMAGE_TAG:-production}'
        restart: unless-stopped
        command: php artisan reverb:start --host=0.0.0.0 --port=6001
        ports:
            - '6001:6001'
        env_file: .env
        networks:
            - app
            - mariadb_default
        depends_on:
            - redis

networks:
    app:
        driver: bridge
    mariadb_default:
        external: true

volumes:
    redis-data:
