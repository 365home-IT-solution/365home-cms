services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: '365home/app:latest'
        restart: unless-stopped
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
        volumes:
            - './storage:/var/www/html/storage'
        env_file: .env
        dns:
            - 8.8.8.8
            - 8.8.4.4
        networks:
            - app
            - mariadb_default
        depends_on:
            - redis

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        networks:
            - app

networks:
    app:
        driver: bridge
    mariadb_default:
        external: true
