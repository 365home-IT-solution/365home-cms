; Tăng giới hạn thực thi để xử lý CCCD scan ảnh lớn (Node.js subprocess)
; stream_get_contents không tính vào max_execution_time trên Linux,
; nhưng fastcgi_read_timeout 120s trong nginx cần PHP vẫn còn sống.
max_execution_time = 60

; Mặc định gói PHP-FPM Ubuntu (upload_max_filesize=2M, post_max_size=8M) thấp hơn giới hạn
; validate CCCD (max:5120 KB = 5MB/ảnh) — ảnh chụp bằng camera điện thoại rất dễ vượt 2MB,
; khiến PHP chặn upload trước cả khi Laravel validate chạy (lỗi "tải lên thất bại" dù ảnh rõ).
; post_max_size dư ra để chịu được nhiều CCCD người đi cùng gửi chung 1 request.
upload_max_filesize = 10M
post_max_size = 50M
