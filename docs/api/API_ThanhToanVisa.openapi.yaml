  /admin/pay2s-card/payments/{id}/sync:
    post:
      tags: [Thanh toán thẻ Visa]
      operationId: syncCardPayment
      summary: "[Admin] Hỏi lại Pay2S trạng thái một giao dịch"
      description: |
        Chỉ cho phiên **đang `pending`** (webhook chậm / lỡ, hoặc máy local không nhận được webhook). Nếu Pay2S báo đã thanh toán thì đơn được xác nhận ngay.
        Giới hạn 20 lần / phút (Pay2S giới hạn 30 yêu cầu / phút).
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: Đã hỏi. `data.status` là trạng thái mới.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AdminCardPaymentDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Không tìm thấy giao dịch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Phiên không còn ở trạng thái chờ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Chỉ đồng bộ được phiên đang chờ thanh toán.
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /admin/pay2s-card/payments/{id}/resolve:
    post:
      tags: [Thanh toán thẻ Visa]
      operationId: resolveCardPayment
      summary: "[Admin] Đánh dấu đã hoàn tiền / xử lý xong"
      description: |
        Chỉ cho khoản **`review`** (tiền đã thu nhưng đơn không nhận). Sau khi hoàn tiền thủ công trên Pay2S, gọi API này để chuyển khoản sang `resolved`,
        ghi lại người xử lý, lúc xử lý và ghi chú; huy hiệu đỏ ở menu CMS giảm tương ứng. Chỉ làm được một lần.
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 490
                  nullable: true
                  description: Ghi chú (vd mã giao dịch hoàn tiền).
            example:
              note: Đã hoàn tay qua Pay2S ngày 19/11
      responses:
        '200':
          description: Đã đánh dấu.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/AdminCardPaymentDetail'
              example:
                message: Đã đánh dấu đã xử lý.
                data:
                  id: 89
                  order_code: '17950000000001'
                  kind: initial
                  card_brand: visa
                  amount: 313500
                  status: resolved
                  environment: production
                  failure_reason: 'Đơn đang ở trạng thái "cancelled_payment", không nhận thanh toán đầu — hoàn tiền thủ công.'
                  pay2s_order_id: C17950000000001-ABCD1234
                  trans_id: INV123
                  paid_at: null
                  created_at: '2026-11-19T08:58:19+07:00'
                  resolved_at: '2026-11-19T10:05:11+07:00'
                  resolved_by: '1'
                  resolution_note: Đã hoàn tay qua Pay2S ngày 19/11
                  expires_at: '2026-11-19T09:13:25+07:00'
                  raw:
                    resultCode: 0
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Không tìm thấy giao dịch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Khoản không ở trạng thái `review`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Chỉ đánh dấu đã xử lý được khoản đang ở trạng thái cần hoàn tiền / đối soát.

  /admin/orders:
    get:
      tags: [Thanh toán thẻ Visa]
      operationId: listAdminOrdersCardLabel
      summary: "[Admin] Danh sách đơn — trường MỚI về thẻ"
      description: |
        API đã có từ trước; **chỉ ghi trường mới** trong mỗi đơn (cả `GET /admin/orders/{order_code}`):
        - `paid_by_card = true` và `payment_label = "Thẻ"` — **chỉ có khi đơn đã trả bằng thẻ**. Đơn khác không có hai khoá này.
        - `payment_method` vẫn là `PayOS` như cũ.
      responses:
        '200':
          description: Thành công (chỉ minh hoạ các trường liên quan của một đơn).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                data:
                  - order_code: '17950000000001'
                    status: paid
                    payment_method: PayOS
                    paid_by_card: true
                    payment_label: Thẻ
                    amount: 313500
        '401':
          $ref: '#/components/responses/Unauthenticated'
