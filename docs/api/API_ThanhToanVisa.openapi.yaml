      security: []
      parameters:
        - $ref: '#/components/parameters/OrderCode'
        - name: phone
          in: query
          required: true
          description: Số điện thoại đã nhập lúc đặt phòng.
          schema:
            type: string
            maxLength: 20
          example: '0912345678'
      responses:
        '200':
          description: Thành công (cùng cấu trúc `GET /orders/{order_code}/card-payment`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardPaymentStatusResponse'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '422':
          description: Thiếu `phone`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /orders/{order_code}:
    get:
      tags: [Thanh toán thẻ Visa]
      operationId: getOrderCardFields
      summary: "[Khách] Chi tiết đơn — các trường MỚI về thẻ"
      description: |
        API đã có từ trước; **chỉ ghi các trường mới** trong `order` (áp dụng cho mọi phản hồi đơn có khối thanh toán: tạo đơn, `payment-qr`, `retry-payment`, `remaining-payment`, `extra-charge-qr`, và bản `/guest/orders/...`):
        - `card_payment` — **chỉ có khi thẻ dùng được** cho đơn (xem `CardPaymentAvailability`).
        - `paid_by_card`, `payment_label` — **chỉ có khi đơn đã trả bằng thẻ**.

        Đơn không thuộc hai trường hợp trên nhận phản hồi **y như trước**.
      parameters:
        - $ref: '#/components/parameters/OrderCode'
      responses:
        '200':
          description: Thành công (chỉ minh hoạ các trường liên quan).
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    type: object
                    additionalProperties: true
                    properties:
                      card_payment:
                        $ref: '#/components/schemas/CardPaymentAvailability'
                      paid_by_card:
                        type: boolean
                      payment_label:
                        type: string
              examples:
                co_the_tra_the:
                  summary: Đơn đang chờ thanh toán, thẻ dùng được
                  value:
                    order:
                      order_code: '17950000000001'
                      status: pending
                      payment_method: PayOS
                      payment_provider: payos
                      card_payment:
                        available: true
                        brands: [visa, mastercard, jcb, amex, unionpay]
                        kind: initial
                        amount: 313500
                        sandbox: false
                da_tra_the:
                  summary: Đơn đã trả bằng thẻ
                  value:
                    order:
                      order_code: '17950000000001'
                      status: paid
                      payment_method: PayOS
                      paid_by_card: true
                      payment_label: Thẻ
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/OrderNotFound'

  # ===================================================================================
  #  B. WEBHOOK (CHỈ PAY2S GỌI)
  # ===================================================================================
  /webhook/pay2s-card:
    post:
      tags: [Thanh toán thẻ Visa]
      operationId: pay2sCardWebhook
      summary: "[Pay2S] Webhook kết quả thanh toán thẻ"
      description: |
        **Chỉ Pay2S gọi — app bỏ qua.** URL này tự gửi kèm mỗi phiên, không cần khai báo ở Pay2S (phải là HTTPS công khai).

        Hệ thống xác thực chữ ký `m2signature` (và `partnerCode`, `accessKey` khớp cấu hình), rồi **đối chiếu số tiền, môi trường và trạng thái đơn**
        trước khi xác nhận đơn. Không khớp ⇒ phiên chuyển `review` để hoàn tiền thủ công. Gửi lặp không xử lý lần hai.

        - `resultCode = 0` ⇒ thanh toán thành công · `2` ⇒ khách huỷ · khác ⇒ thất bại.
        - Trả `200 {"success":true}` sau khi đã lưu; sai chữ ký `401`; lỗi tạm thời `500` (Pay2S gửi lại tối đa 5 lần).
        - Webhook chỉ gửi cho thành công và huỷ; các trạng thái khác hệ thống tự hỏi bằng lệnh đồng bộ.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pay2SWebhook'
            example:
              accessKey: ACCESSKEY_VI_DU
              amount: 313500
              extraData: ''
              message: Paymentsuccessful
              orderId: C17950000000001-ABCD1234
              orderInfo: Thanh toan don 17950000000001
              orderType: card
              partnerCode: PAY2SXXXXXXXXXXXX
              payType: card
              requestId: r1
              responseTime: '1763518400000'
              resultCode: 0
              transId: INV123
              m2signature: 9c1f0d5e...
      responses:
        '200':
          description: Đã nhận và xử lý (kể cả khi bỏ qua vì đã xử lý trước đó).
          content:
            application/json:
              example:
                success: true
        '401':
          description: Sai chữ ký.
          content:
            application/json:
              example:
                success: false
                message: Invalid signature.
        '500':
          description: Lỗi xử lý tạm thời — Pay2S sẽ gửi lại.
          content:
            application/json:
              example:
                success: false

  # ===================================================================================
  #  C. QUẢN TRỊ (SUPER ADMIN)
  # ===================================================================================
  /admin/pay2s-card/settings:
    get:
      tags: [Thanh toán thẻ Visa]
      operationId: getCardSettings
      summary: "[Admin] Xem cấu hình thanh toán thẻ"
      description: Chỉ Super Admin. Khoá bí mật **không bao giờ** trả ra, chỉ báo `configured`.
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CardSettings'
              example:
                data:
                  enabled: true
                  configured: true
                  partner_code: PAY2SXXXXXXXXXXXX
                  access_key:
                    configured: true
                  secret_key:
                    configured: true
                  connection_id: null
                  sandbox_only: true
                  merchant_origin: https://365home.vn
                  api_url: https://payment.pay2s.vn/api/card-popup-session.php
                  category_ids: [203, 169, 167]
                  webhook_url: https://365home.vn/api/webhook/pay2s-card
                  brands: [visa, mastercard, jcb, amex, unionpay]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

    put:
      tags: [Thanh toán thẻ Visa]
      operationId: updateCardSettings
      summary: "[Admin] Lưu cấu hình thanh toán thẻ"
      description: |
        Chỉ gửi trường cần đổi. `access_key` / `secret_key` để trống hoặc không gửi = **giữ nguyên**.
        `api_url` phải là địa chỉ cổng thẻ (chứa `card-popup-session`); **không** dùng địa chỉ cổng chuyển khoản `/v1/gateway/api/create`.
        `sandbox_only = true` (mặc định) chỉ chạy thẻ giả lập; tắt khi Pay2S đã duyệt chạy thật.
        Muốn chỉ bật / tắt thì dùng `PUT /admin/pay2s-card/enabled`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                sandbox_only:
                  type: boolean
                partner_code:
                  type: string
                  nullable: true
                  maxLength: 100
                connection_id:
                  type: string
                  nullable: true
                  maxLength: 100
                access_key:
                  type: string
                  maxLength: 500
                secret_key:
                  type: string
                  maxLength: 500
                merchant_origin:
                  type: string
                  format: uri
                  nullable: true
                  maxLength: 255
                api_url:
                  type: string
                  format: uri
                  nullable: true
                  maxLength: 255
                category_ids:
                  type: array
                  items:
                    type: integer
                  description: ID chi nhánh (categories.id) được thanh toán thẻ.
            example:
              enabled: true
              sandbox_only: true
              partner_code: PAY2SXXXXXXXXXXXX
              access_key: ACCESSKEY_VI_DU
              secret_key: SECRETKEY_VI_DU
              merchant_origin: https://365home.vn
              category_ids: [203, 169, 167]
      responses:
        '200':
          description: Đã lưu.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/CardSettings'
              example:
                message: Đã lưu — thanh toán thẻ đang BẬT.
                data:
                  enabled: true
                  configured: true
                  partner_code: PAY2SXXXXXXXXXXXX
                  access_key:
                    configured: true
                  secret_key:
                    configured: true
                  connection_id: null
                  sandbox_only: true
                  merchant_origin: https://365home.vn
                  api_url: https://payment.pay2s.vn/api/card-popup-session.php
                  category_ids: [203, 169, 167]
                  webhook_url: https://365home.vn/api/webhook/pay2s-card
                  brands: [visa, mastercard, jcb, amex, unionpay]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Dữ liệu không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /admin/pay2s-card/enabled:
    put:
      tags: [Thanh toán thẻ Visa]
      operationId: toggleCardPayment
      summary: "[Admin] Nút BẬT / TẮT thanh toán thẻ"
      description: |
        Bật / tắt tức thì, không đụng tới các cấu hình khác.

        - **TẮT**: khách và admin không thấy gì về thẻ (như chưa có tính năng). Phiên đã tạo trước đó vẫn được xác nhận nếu tiền về.
        - **BẬT**: khách ở các chi nhánh đã chọn thấy lựa chọn thẻ, **nếu** đã đủ Partner Code, Access Key, Secret Key (xem `configured` ở `GET /admin/pay2s-card/settings`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
            example:
              enabled: false
      responses:
        '200':
          description: Đã đổi.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/CardSettings'
              example:
                message: Thanh toán thẻ đang TẮT.
                data:
                  enabled: false
                  configured: false
                  partner_code: PAY2SXXXXXXXXXXXX
                  access_key:
                    configured: true
                  secret_key:
                    configured: true
                  connection_id: null
                  sandbox_only: true
                  merchant_origin: https://365home.vn
                  api_url: https://payment.pay2s.vn/api/card-popup-session.php
                  category_ids: [203, 169, 167]
                  webhook_url: https://365home.vn/api/webhook/pay2s-card
                  brands: [visa, mastercard, jcb, amex, unionpay]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Thiếu hoặc sai kiểu `enabled`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /admin/pay2s-card/test-connection:
    post:
      tags: [Thanh toán thẻ Visa]
      operationId: testCardConnection
      summary: "[Admin] Kiểm tra khoá Pay2S"
      description: |
        Gọi thử Pay2S bằng khoá đang lưu (hỏi trạng thái một mã đơn không tồn tại). Pay2S trả "không tìm thấy đơn" nghĩa là **khoá và chữ ký hợp lệ** (`ok = true`).
        Báo `ok = false` khi chưa bật / thiếu khoá, hoặc Pay2S từ chối khoá, hoặc `api_url` sai. Giới hạn 10 lần / phút.
      responses:
        '200':
          description: Kết quả kiểm tra.
          content:
            application/json:
              example:
                ok: true
                message: 'Khoá được Pay2S chấp nhận (Pay2S trả lỗi (404): Không tìm thấy đơn.).'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /admin/pay2s-card/payments:
    get:
      tags: [Thanh toán thẻ Visa]
      operationId: listCardPayments
      summary: "[Admin] Danh sách giao dịch thẻ"
      description: |
        Để đối soát. Lọc `status=review` ⇒ tiền thẻ **đã thu nhưng đơn không nhận được** (đơn đã huỷ / sai số tiền / giao dịch thử ở chế độ thật) — **hoàn tiền thủ công trên Pay2S**,
        rồi `POST /admin/pay2s-card/payments/{id}/resolve`. Mới nhất trước.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CardStatus'
        - name: order_code
          in: query
          required: false
          description: Lọc theo mã đơn.
          schema:
            type: string
            maxLength: 50
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminCardPayment'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
              example:
