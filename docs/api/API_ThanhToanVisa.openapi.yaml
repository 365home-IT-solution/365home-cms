# =====================================================================================
#  365 HOME — Thanh toán thẻ Visa / Mastercard / JCB / AMEX / UnionPay (qua Pay2S)
#  Định dạng OpenAPI 3.0 (YAML) theo file mẫu API Reference.
#  Import: Admin > API Reference > chọn dự án + phiên bản > Import.
#  Cả tính năng là MỚI ở nhánh này nên tài liệu mô tả đầy đủ. Các API đơn đã có chỉ ghi phần thêm (nhãn, khối card_payment).
# =====================================================================================
openapi: 3.0.3

info:
  title: Thanh toán thẻ Visa (Pay2S) - 365 HOME
  version: 1.0.0
  description: |
    Khách trả tiền đơn bằng **thẻ quốc tế** (Visa, Mastercard, JCB, AMEX, UnionPay). Tiền thẻ về tài khoản Pay2S của **365 Home**.
    Chỉ áp dụng cho **chi nhánh của 365 Home** được bật trong CMS; đơn của đối tác vẫn thanh toán chuyển khoản như cũ.

    ## Nút BẬT / TẮT
    - Có công tắc **Bật / Tắt thanh toán thẻ** ở CMS (Cấu hình web → Pay2S — thanh toán thẻ) và qua API `PUT /admin/pay2s-card/enabled`.
    - **TẮT** ⇒ mọi thứ từ admin tới khách chạy **y như chưa có tính năng**: khách không thấy lựa chọn thẻ, phản hồi đơn **không có** khối `card_payment`,
      API tạo phiên trả `422`, menu "Giao dịch thẻ Pay2S" ẩn (nếu chưa từng có giao dịch). Trang cấu hình vẫn còn để bật lại.
    - Các phiên thẻ **đã tạo trước khi tắt** vẫn được xác nhận nếu tiền về (webhook / đồng bộ vẫn chạy) để không mất đơn đã thu tiền.
    - Mặc định khi cài mới: **TẮT** và ở **chế độ thử** (sandbox).

    ## Luồng cho app / web khách (làm theo thứ tự)
    0. **Trước khi có đơn** (màn chọn phương thức thanh toán lúc đặt phòng): gọi `GET /card-payment/options?category_id={id chi nhánh}` (công khai, không cần đăng nhập)
       để biết chi nhánh này có nhận thẻ quốc tế không. `available = false` ⇒ ẩn lựa chọn "Thẻ quốc tế". Sau khi đơn được tạo, dùng khối `card_payment` ở bước 1 (chính xác theo khoản đang cần thu).
    1. Phản hồi đơn (xem đơn, tạo đơn, `payment-qr`, `retry-payment`, `remaining-payment`, `extra-charge-qr`, cả bản `/guest`) có khối **`card_payment`** **chỉ khi thẻ dùng được cho đơn đó**.
       **Không có khối này ⇒ không hiện nút thẻ.** Có khối với `available = true` ⇒ hiện nút **"Thanh toán thẻ"** cạnh QR chuyển khoản; `amount` là số tiền sẽ thu, `brands` là các loại thẻ được chọn.
    2. Khách chọn loại thẻ rồi bấm nút ⇒ `POST /orders/{order_code}/card-payment` ⇒ nhận **`payment_url`**.
    3. **Mở `payment_url`** (webview / trình duyệt). Khách nhập thẻ **trực tiếp trên trang của cổng thanh toán** (hệ thống 365 Home không nhận số thẻ). 3D Secure làm ngay trên trang đó.
    4. Khi khách quay lại app, gọi `GET /orders/{order_code}/card-payment` mỗi **3–5 giây** tới khi `data.status` khác `pending`. API này tự hỏi cổng khi webhook chậm.
       Có thể truyền `return_url` (deep link hoặc trang riêng) ở bước 2 để cổng đưa khách về đúng chỗ.
    5. Kết quả: `paid` ⇒ đơn đã chuyển `paid` (hoặc `deposit` nếu đặt cọc); `failed` / `cancelled` / `expired` ⇒ cho thử lại; `review` ⇒ hiện
       "Chúng tôi đã nhận thanh toán, nhân viên sẽ liên hệ để xử lý".
    6. Muốn thử lại ⇒ gọi `POST` lần nữa (phiên còn hạn, cùng loại thẻ và số tiền được dùng lại).

    ## Số tiền thu theo giai đoạn của đơn
    | `kind` | Khi nào | Số tiền |
    |---|---|---|
    | `initial` | Đơn `pending` | Đúng tiền cần thu ngay: 100% nếu thanh toán đủ, hoặc tiền cọc nếu đặt cọc |
    | `remaining` | Đơn `deposit` (đã cọc) | Phần còn lại (+ khoản phát sinh nếu có) |
    | `extra` | Đơn `paid` có khoản phát sinh chưa trả | Khoản phát sinh |

    Tối thiểu **2.000đ**. Phiên thẻ hết hạn sau **15 phút**; với khoản `initial` hệ thống kéo dài hạn giữ đơn cho khớp để đơn không bị tự huỷ khi khách đang nhập thẻ.

    ## Trạng thái phiên thẻ
    | `status` | Ý nghĩa |
    |---|---|
    | `pending` | Đang chờ khách thanh toán |
    | `paid` | Đã thanh toán, đơn đã được xác nhận |
    | `failed` | Thất bại |
    | `cancelled` | Khách huỷ (hoặc bị thay bằng phiên mới) |
    | `expired` | Hết hạn |
    | `review` | Cổng **đã thu tiền** nhưng đơn không còn nhận được khoản này (đơn đã huỷ / hết hạn / sai số tiền / giao dịch thử ở chế độ thật) ⇒ **hoàn tiền thủ công** |
    | `resolved` | Khoản `review` đã được admin hoàn tiền / xử lý xong |

    ## Nhãn "Thẻ"
    Đơn **đã trả bằng thẻ** có thêm `paid_by_card = true` và `payment_label = "Thẻ"` trong phản hồi đơn (khách và admin) và nhãn **"Thẻ"** ở cột Thanh toán của danh sách đơn trong CMS.
    Đơn khác **không có** hai khoá này (phản hồi giữ nguyên). `payment_method` vẫn là `PayOS` như cũ để báo cáo doanh thu không đổi.

    ## Xác nhận tự động (như chuyển khoản)
    Ba lớp, cùng một bộ kiểm tra (số tiền, môi trường, trạng thái đơn) nên không bao giờ xác nhận hai lần:
    - **Webhook** của cổng gọi `POST /webhook/pay2s-card` (tức thì khi chạy trên domain công khai).
    - **Trang / app hỏi trạng thái**: `GET .../card-payment` tự hỏi cổng khi phiên còn `pending`.
    - **Lệnh nền** `php artisan pay2s-card:sync` chạy mỗi phút (cần cron `schedule:run`), phòng khi khách đóng trình duyệt hoặc webhook lỡ.

    ## Lưu ý quan trọng
    - Bộ thẻ của Pay2S **không có API hoàn tiền**. Khách huỷ đơn đã trả thẻ thì hoàn thủ công trên Pay2S, rồi admin bấm "Đã hoàn tiền" (`POST /admin/pay2s-card/payments/{id}/resolve`).
    - **Chế độ thử (`sandbox_only = true`)**: dùng thẻ giả lập nhưng đơn **vẫn được đánh dấu đã thanh toán thật**. Chỉ dùng để thử; xoá đơn thử sau đó. Giao dịch sandbox bị **từ chối** (chuyển `review`) khi hệ thống đang ở chế độ thật.
    - Chạy thật cần Pay2S duyệt hồ sơ, domain (`merchant_origin`) và gói dịch vụ; tắt chế độ thử sau khi được duyệt.
    - `return_url` được hệ thống tự đổi gốc (origin) cho khớp `merchant_origin` đã đăng ký (cổng bắt buộc cùng origin).

    ## Quy ước chung
    - Khách có tài khoản: `Authorization: Bearer {token}`. Khách **không đăng nhập**: dùng đường dẫn `/guest/...` kèm `phone` (số điện thoại đặt phòng), không cần token.
    - Admin: token Super Admin (`POST /api/admin/login`).
    - Dữ liệu trả về bọc trong `data`. Lỗi trả `{ "message": "..." }`; lỗi nhập liệu (422) có thêm `errors.{tên trường}[0]`. Thông báo lỗi là tiếng Việt, hiện thẳng cho khách được.

servers:
  - url: https://365home.vn/api
    description: Production

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token nhận được khi đăng nhập. Gửi kèm header  Authorization  Bearer <token>.

  parameters:
    OrderCode:
      name: order_code
      in: path
      required: true
      description: Mã đơn (`order_code`).
      schema:
        type: string
      example: '17950000000001'
    PaymentId:
      name: id
      in: path
      required: true
      description: ID phiên thanh toán thẻ (lấy từ `GET /admin/pay2s-card/payments`).
      schema:
        type: integer
      example: 89

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          description: Thông báo lỗi cho người dùng.
      example:
        message: Đơn hàng không tồn tại.

    ValidationError:
      type: object
      description: Lỗi dữ liệu gửi lên không hợp lệ (HTTP 422).
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      example:
        message: Đơn này chưa hỗ trợ thanh toán bằng thẻ.
        errors:
          order:
            - Đơn này chưa hỗ trợ thanh toán bằng thẻ.

    CardBrand:
      type: string
      enum: [visa, mastercard, jcb, amex, unionpay]
      description: Loại thẻ.

    CardKind:
      type: string
      enum: [initial, remaining, extra]
      description: Khoản thu — `initial` thanh toán đầu / cọc, `remaining` phần còn lại, `extra` phát sinh.

    CardStatus:
      type: string
      enum: [pending, paid, failed, cancelled, expired, review, resolved]

    CardPaymentAvailability:
      type: object
      description: Khối `card_payment` trong phản hồi đơn. **Chỉ có khi thẻ dùng được cho đơn đó.**
      properties:
        available:
          type: boolean
          description: true ⇒ hiện nút "Thanh toán thẻ".
          example: true
        brands:
          type: array
          items:
            $ref: '#/components/schemas/CardBrand'
        kind:
          $ref: '#/components/schemas/CardKind'
        amount:
          type: integer
          description: Số tiền sẽ thu (VND).
          example: 313500
        sandbox:
          type: boolean
          description: true ⇒ đang ở chế độ thử, chỉ dùng thẻ giả lập.

    CardPayment:
      type: object
      description: Một phiên thanh toán thẻ của đơn.
      properties:
        order_code:
          type: string
          example: '17950000000001'
        order_status:
          type: string
          description: Trạng thái hiện tại của đơn (`pending`, `deposit`, `paid`...). Đổi theo kết quả thanh toán.
          example: pending
        status:
          $ref: '#/components/schemas/CardStatus'
        kind:
          $ref: '#/components/schemas/CardKind'
        amount:
          type: integer
          example: 313500
        card_brand:
          $ref: '#/components/schemas/CardBrand'
        payment_url:
          type: string
          nullable: true
          description: Link trang nhập thẻ của cổng. **Chỉ có khi `status = pending`** (null ở trạng thái khác). Mở trong webview / trình duyệt.
          example: https://payment.pay2s.vn/card-checkout/index.html#card-session=0123456789abcdef
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Hạn của phiên (15 phút kể từ lúc tạo).
        environment:
          type: string
          nullable: true
          enum: [sandbox, production]

    CardPaymentResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/CardPayment'

    CardPaymentStatusResponse:
      type: object
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/CardPayment'
          nullable: true
          description: Phiên thẻ mới nhất của đơn; `null` nếu đơn chưa có phiên nào.
        card_payment:
          type: object
          description: 'Cùng nội dung khối `card_payment` của phản hồi đơn, **luôn có** ở API này; khi thẻ không dùng được thì chỉ có `available: false`.'
          properties:
            available:
              type: boolean
            brands:
              type: array
              items:
                $ref: '#/components/schemas/CardBrand'
            kind:
              $ref: '#/components/schemas/CardKind'
            amount:
              type: integer
            sandbox:
              type: boolean

    CardLabelFields:
      type: object
      description: Hai khoá chỉ có ở đơn ĐÃ trả bằng thẻ.
      properties:
        paid_by_card:
          type: boolean
          example: true
        payment_label:
          type: string
          example: Thẻ

    CardSettings:
      type: object
      description: Cấu hình thanh toán thẻ. Khoá bí mật **không bao giờ** được trả ra, chỉ báo `configured`.
      properties:
        enabled:
          type: boolean
          description: Nút bật / tắt.
        configured:
          type: boolean
          description: true = đã bật **và** đủ Partner Code, Access Key, Secret Key.
        partner_code:
          type: string
          nullable: true
        access_key:
          type: object
          properties:
            configured:
              type: boolean
        secret_key:
          type: object
          properties:
            configured:
              type: boolean
        connection_id:
          type: string
          nullable: true
          description: Kết nối Pay2S. Trống = kết nối mặc định của tài khoản Pay2S.
        sandbox_only:
          type: boolean
          description: true = chế độ thử (thẻ giả lập, vẫn đánh dấu đơn đã thanh toán).
        merchant_origin:
          type: string
          description: Origin HTTPS đã đăng ký với Pay2S (vd https://365home.vn). Trống = theo `APP_URL`.
        api_url:
          type: string
          description: Địa chỉ API cổng thẻ (mặc định địa chỉ chính thức).
        category_ids:
          type: array
          items:
            type: integer
          description: Chi nhánh được thanh toán thẻ (gồm cả khu vực con).
        webhook_url:
          type: string
          description: Địa chỉ webhook, tự gửi kèm mỗi phiên, không cần khai báo ở Pay2S. Phải là HTTPS công khai.
        brands:
          type: array
          items:
            $ref: '#/components/schemas/CardBrand'

    AdminCardPayment:
      type: object
      description: Một phiên thanh toán thẻ (màn đối soát).
      properties:
        id:
          type: integer
          example: 89
        order_code:
          type: string
          nullable: true
        kind:
          $ref: '#/components/schemas/CardKind'
        card_brand:
          $ref: '#/components/schemas/CardBrand'
        amount:
          type: integer
        status:
          $ref: '#/components/schemas/CardStatus'
        environment:
          type: string
          nullable: true
          enum: [sandbox, production]
        failure_reason:
          type: string
          nullable: true
          description: Lý do với phiên `failed` / `cancelled` / `review`.
        pay2s_order_id:
          type: string
          description: Mã đơn gửi sang Pay2S (duy nhất).
          example: C17950000000001-ABCD1234
        trans_id:
          type: string
          nullable: true
          description: Mã giao dịch phía Pay2S (số hoá đơn).
        paid_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
          description: Lúc admin đánh dấu đã hoàn tiền (khoản `resolved`).
        resolved_by:
          type: string
          nullable: true
          description: ID admin đã đánh dấu.
        resolution_note:
          type: string
          nullable: true

    AdminCardPaymentDetail:
      allOf:
        - $ref: '#/components/schemas/AdminCardPayment'
        - type: object
          properties:
            expires_at:
              type: string
              format: date-time
              nullable: true
            raw:
              type: object
              additionalProperties: true
              description: Dữ liệu Pay2S gửi về, **đã bỏ `accessKey` và chữ ký**, để đối soát.

    PageMeta:
      type: object
      properties:
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer

    Pay2SWebhook:
      type: object
      description: Nội dung Pay2S gửi tới webhook (chỉ có ở kết quả thành công và huỷ).
      properties:
        accessKey:
          type: string
        amount:
          type: integer
          example: 313500
        extraData:
          type: string
        message:
          type: string
          example: Paymentsuccessful
        orderId:
          type: string
          description: Mã đơn đã gửi lúc tạo phiên (`pay2s_order_id`).
          example: C17950000000001-ABCD1234
        orderInfo:
          type: string
        orderType:
          type: string
          example: card
        partnerCode:
          type: string
        payType:
          type: string
          example: card
        requestId:
          type: string
        responseTime:
          type: string
        resultCode:
          type: integer
          description: "`0` thành công · `2` khách huỷ · khác = thất bại."
          example: 0
        transId:
          type: string
          description: Số hoá đơn phía Pay2S (không phải mã giao dịch thẻ).
          example: INV123
        m2signature:
          type: string
          description: HMAC-SHA256 (khoá Secret Key) trên chuỗi `key=value` nối bằng `&` theo thứ tự cố định các trường `accessKey, amount, extraData, message, orderId, orderInfo, orderType, partnerCode, payType, requestId, responseTime, resultCode, transId`.

  responses:
    Unauthenticated:
      description: Chưa đăng nhập hoặc token hết hạn.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Unauthenticated.
    OrderNotFound:
      description: Đơn không tồn tại (hoặc sai số điện thoại với khách không đăng nhập).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Đơn hàng không tồn tại.
    CardNotAvailable:
      description: |
        Không tạo được phiên: đơn chưa hỗ trợ thẻ (chi nhánh chưa bật, thuộc đối tác, **thẻ đang TẮT**), đơn không còn khoản cần thanh toán, hoặc loại thẻ sai.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          examples:
            chua_ho_tro:
              summary: Đơn chưa hỗ trợ thanh toán thẻ (kể cả khi thẻ đang tắt)
              value:
                message: Đơn này chưa hỗ trợ thanh toán bằng thẻ.
                errors:
                  order:
                    - Đơn này chưa hỗ trợ thanh toán bằng thẻ.
            het_khoan:
              summary: Không còn khoản cần thanh toán
              value:
                message: Đơn không còn khoản nào cần thanh toán.
                errors:
                  order:
                    - Đơn không còn khoản nào cần thanh toán.
            sai_the:
              summary: Loại thẻ không hợp lệ
              value:
                message: The selected card brand is invalid.
                errors:
                  card_brand:
                    - The selected card brand is invalid.
    GatewayError:
      description: Cổng Pay2S tạm lỗi, không tạo được phiên. Cho khách thử lại hoặc chuyển sang QR.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Không tạo được phiên thanh toán thẻ. Vui lòng thử lại sau.
    Forbidden:
      description: Chỉ Super Admin.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Chỉ Super Admin được xem hoặc sửa cấu hình thanh toán thẻ.
    TooManyRequests:
      description: Gọi quá nhanh.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Too Many Attempts.

paths:
  # ===================================================================================
  #  A. APP / WEB KHÁCH
  # ===================================================================================
  /card-payment/options:
    get:
      tags: [Thanh toán thẻ Visa]
      operationId: cardPaymentOptions
      summary: "[Công khai] Chi nhánh này có nhận thanh toán thẻ không?"
      description: |
        Dùng ở **bước đặt phòng, khi chưa có đơn**, để quyết định có hiện lựa chọn "Thẻ quốc tế" hay không. Không cần đăng nhập.

        `available = true` khi: thanh toán thẻ đang **BẬT**, đã cấu hình khoá, chi nhánh (hoặc chi nhánh cha) nằm trong danh sách được bật thẻ, và chi nhánh thuộc **365 Home** (không phải đối tác thường).
        Ngược lại trả `{ "available": false }` (không phải lỗi). Khi đã có đơn, dùng khối `card_payment` trong chi tiết đơn để biết khoản và số tiền cần thu.
        Giới hạn 60 lần / phút.
      parameters:
        - name: category_id
          in: query
          required: true
          description: ID chi nhánh (hoặc khu vực) của sản phẩm đang đặt.
          schema:
            type: integer
            minimum: 1
          example: 203
      security: []
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      available:
                        type: boolean
                      brands:
                        type: array
                        items:
                          $ref: '#/components/schemas/CardBrand'
                        description: Chỉ có khi `available = true`.
                      min_amount:
                        type: integer
                        description: Số tiền tối thiểu mỗi lần thanh toán thẻ (đồng). Chỉ có khi `available = true`.
                      sandbox:
                        type: boolean
                        description: true ⇒ đang ở chế độ thử. Chỉ có khi `available = true`.
              examples:
                co:
                  summary: Chi nhánh nhận thẻ
                  value:
                    data:
                      available: true
                      brands: [visa, mastercard, jcb, amex, unionpay]
                      min_amount: 2000
                      sandbox: false
                khong:
                  summary: Không nhận thẻ (đối tác thường, chưa bật, hoặc đang tắt)
                  value:
                    data:
                      available: false
        '422':
          description: Thiếu hoặc sai `category_id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: The category id field is required.
                errors:
                  category_id:
                    - The category id field is required.
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /orders/{order_code}/card-payment:
    post:
      tags: [Thanh toán thẻ Visa]
      operationId: createCardPayment
      summary: "[Khách] Tạo phiên thanh toán thẻ"
      description: |
        Tạo (hoặc **dùng lại** phiên còn hạn có cùng khoản, số tiền và loại thẻ) phiên thanh toán thẻ cho khoản đang chờ của đơn. Trả `payment_url` để mở trang nhập thẻ.

        - Chỉ đơn của **chính khách đang đăng nhập**.
        - Phiên cũ chưa trả của đơn tự chuyển `cancelled` khi tạo phiên mới khác khoản / số tiền.
        - Khi thẻ **đang tắt**, hoặc đơn thuộc đối tác, trả `422`.
      parameters:
        - $ref: '#/components/parameters/OrderCode'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                card_brand:
                  $ref: '#/components/schemas/CardBrand'
                return_url:
                  type: string
                  format: uri
                  maxLength: 500
                  description: Trang (deep link hoặc web) cổng đưa khách về sau khi thanh toán. Bỏ trống = trang kết quả mặc định.
            example:
              card_brand: visa
              return_url: https://365home.vn/thong-tin-dat-phong/17950000000001?card_return=1
      responses:
        '200':
          description: Phiên đã tạo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardPaymentResponse'
              example:
                data:
                  order_code: '17950000000001'
                  order_status: pending
                  status: pending
                  kind: initial
                  amount: 313500
                  card_brand: visa
                  payment_url: https://payment.pay2s.vn/card-checkout/index.html#card-session=0123456789abcdef
                  expires_at: '2026-11-19T09:13:25+07:00'
                  environment: sandbox
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '422':
          $ref: '#/components/responses/CardNotAvailable'
        '502':
          $ref: '#/components/responses/GatewayError'

    get:
      tags: [Thanh toán thẻ Visa]
      operationId: getCardPayment
      summary: "[Khách] Xem trạng thái thanh toán thẻ của đơn"
      description: |
        Trả phiên thẻ mới nhất của đơn kèm `card_payment`. Phiên đang `pending` được hệ thống **tự hỏi cổng** để cập nhật nếu webhook chậm,
        nên app gọi lặp mỗi 3–5 giây sau khi khách quay lại là đủ.
      parameters:
        - $ref: '#/components/parameters/OrderCode'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardPaymentStatusResponse'
              examples:
                dang_cho:
                  summary: Phiên đang chờ
                  value:
                    data:
                      order_code: '17950000000001'
                      order_status: pending
                      status: pending
                      kind: initial
                      amount: 313500
                      card_brand: visa
                      payment_url: https://payment.pay2s.vn/card-checkout/index.html#card-session=0123456789abcdef
                      expires_at: '2026-11-19T09:13:25+07:00'
                      environment: sandbox
                    card_payment:
                      available: true
                      brands: [visa, mastercard, jcb, amex, unionpay]
                      kind: initial
                      amount: 313500
                      sandbox: true
                da_tra:
                  summary: Đã thanh toán
                  value:
                    data:
                      order_code: '17950000000001'
                      order_status: paid
                      status: paid
                      kind: initial
                      amount: 313500
                      card_brand: visa
                      payment_url: null
                      expires_at: '2026-11-19T09:13:25+07:00'
                      environment: sandbox
                    card_payment:
                      available: false
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/OrderNotFound'

  /guest/orders/{order_code}/card-payment:
    post:
      tags: [Thanh toán thẻ Visa]
      operationId: guestCreateCardPayment
      summary: "[Khách vãng lai] Tạo phiên thanh toán thẻ"
      description: |
        Giống `POST /orders/{order_code}/card-payment` nhưng **không cần token**; xác thực bằng `phone` (số điện thoại đã nhập lúc đặt phòng).
