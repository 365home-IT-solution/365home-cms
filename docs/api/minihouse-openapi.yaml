openapi: 3.0.3
info:
  title: MiniHouse API
  description: >
    API quản lý cho thuê theo tháng (nhà trọ/chung cư mini) — song song với bản tài liệu đầy đủ ở
    docs/api/minihouse-api.md (nguồn tham chiếu chính, file này là bản đặc tả OpenAPI/Swagger tương
    ứng để import vào Swagger UI / Postman / generate SDK client).
  version: "1.0.0"
servers:
  - url: https://365home-cms.test/api
    description: Local (Herd)

tags:
  - name: Xác thực Admin
  - name: Toà nhà
  - name: Phòng
  - name: Số điện nước
  - name: Tiện ích
  - name: Khách thuê
  - name: Hợp đồng
  - name: Hoá đơn
  - name: Thanh toán hoá đơn
  - name: Thu chi
  - name: Phụ thu
  - name: Nhắc việc
  - name: Thông báo (Announcement)
  - name: Khai báo lưu trú
  - name: Webhook
  - name: Portal - Xác thực
  - name: Portal - Tổng quan
  - name: Portal - Thông báo
  - name: Portal - Hoá đơn
  - name: Portal - Thanh toán
  - name: Portal - Hợp đồng
  - name: Portal - Phản hồi
  - name: Portal - Mật khẩu
  - name: Portal - Thông báo đẩy

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token Sanctum của App\Models\User (nhân viên/chủ nhà) — lấy từ POST /admin/login.
    tenantBearerAuth:
      type: http
      scheme: bearer
      description: Bearer token Sanctum RIÊNG của Tenant (khách thuê) — lấy từ các endpoint đăng nhập Portal (mục 17.1).

  parameters:
    perPage:
      name: per_page
      in: query
      schema: { type: integer, default: 20 }

  schemas:
    # ---------- Chung ----------
    Message:
      type: object
      properties:
        message: { type: string }

    ValidationError:
      type: object
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    # ---------- Xác thực Admin ----------
    AdminUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        fullname: { type: string }
        email: { type: string }
        roles: { type: array, items: { type: string } }
        is_super_admin: { type: boolean }

    AdminLoginResponse:
      type: object
      properties:
        token: { type: string }
        user: { $ref: '#/components/schemas/AdminUser' }

    # ---------- Toà nhà ----------
    Building:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        address: { type: string }
        province: { type: string }
        ward: { type: string }
        electric_unit_price: { type: number }
        water_unit_price: { type: number }
        note: { type: string, nullable: true }
        image: { type: string, nullable: true }
        rooms_count: { type: integer, description: "Chỉ có ở danh sách" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BuildingWrite:
      type: object
      required: [name, address]
      properties:
        name: { type: string }
        address: { type: string }
        province: { type: string }
        ward: { type: string }
        electric_unit_price: { type: number }
        water_unit_price: { type: number }
        note: { type: string, nullable: true }

    # ---------- Phòng ----------
    RoomAmenity:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }

    Room:
      type: object
      properties:
        id: { type: integer }
        building_id: { type: integer }
        building_name: { type: string }
        code: { type: string }
        floor: { type: integer }
        position_row: { type: integer }
        position_col: { type: integer }
        area: { type: number }
        price: { type: number }
        status: { type: string, enum: [trong, dat_coc, dang_thue, bao_tri] }
        note: { type: string, nullable: true }
        photos: { type: array, items: { type: string } }
        amenities: { type: array, items: { $ref: '#/components/schemas/RoomAmenity' } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RoomWrite:
      type: object
      required: [building_id, code, price, status]
      properties:
        building_id: { type: integer }
        code: { type: string }
        floor: { type: integer }
        position_row: { type: integer }
        position_col: { type: integer }
        area: { type: number }
        price: { type: number }
        status: { type: string, enum: [trong, dat_coc, dang_thue, bao_tri] }
        note: { type: string, nullable: true }
        amenity_ids: { type: array, items: { type: integer } }

    # ---------- Số điện nước ----------
    MeteringReading:
      type: object
      properties:
        id: { type: integer }
        room_id: { type: integer }
        room_code: { type: string }
        building_id: { type: integer }
        month: { type: string, example: "2026-10" }
        electric_start: { type: number, description: "Do hệ thống tự tính, không nhận qua request" }
        electric_end: { type: number, nullable: true }
        water_start: { type: number, description: "Do hệ thống tự tính, không nhận qua request" }
        water_end: { type: number, nullable: true }
        note: { type: string, nullable: true }
        is_used_in_invoice: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    MeteringReadingCreate:
      type: object
      required: [room_id, month]
      properties:
        room_id: { type: integer }
        month: { type: string, example: "2026-11" }
        electric_end: { type: number }
        water_end: { type: number }
        note: { type: string, nullable: true }

    MeteringReadingUpdate:
      type: object
      properties:
        electric_end: { type: number }
        water_end: { type: number }
        note: { type: string, nullable: true }

    # ---------- Tiện ích ----------
    Amenity:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        image: { type: string, nullable: true }

    AmenityWrite:
      type: object
      required: [name]
      properties:
        name: { type: string }
        image: { type: string, nullable: true }

    # ---------- Khách thuê ----------
    Tenant:
      type: object
      properties:
        id: { type: integer }
        fullname: { type: string }
        phone: { type: string }
        id_card_number: { type: string }
        id_card_front: { type: string, nullable: true }
        id_card_back: { type: string, nullable: true }
        date_of_birth: { type: string, format: date }
        gender: { type: string, enum: [nam, nu, khac] }
        hometown: { type: string, nullable: true }
        permanent_address: { type: string, nullable: true }
        occupation: { type: string, nullable: true }
        workplace: { type: string, nullable: true }
        emergency_contact_name: { type: string, nullable: true }
        emergency_contact_phone: { type: string, nullable: true }
        residence_declared: { type: boolean }
        residence_declared_at: { type: string, format: date, nullable: true }
        room_id: { type: integer, nullable: true }
        room_code: { type: string, nullable: true }
        note: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TenantWrite:
      type: object
      required: [fullname, phone, id_card_number]
      properties:
        fullname: { type: string }
        phone: { type: string }
        id_card_number: { type: string }
        date_of_birth: { type: string, format: date }
        gender: { type: string, enum: [nam, nu, khac] }
        room_id: { type: integer, nullable: true }

    # ---------- Hợp đồng ----------
    Contract:
      type: object
      properties:
        id: { type: integer }
        room_id: { type: integer }
        room_code: { type: string }
        building_id: { type: integer }
        building_name: { type: string }
        tenant_id: { type: integer }
        tenant_name: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        monthly_price: { type: number }
        deposit_amount: { type: number }
        status: { type: string, enum: [active, expired, cancelled] }
        electric_unit_price: { type: number, nullable: true }
        water_unit_price: { type: number, nullable: true }
        reason_for_stay: { type: string, nullable: true }
        custom_reason: { type: string, nullable: true }
        checkout_at: { type: string, format: date, nullable: true }
        deposit_refunded_amount: { type: number, nullable: true }
        deposit_deduction_reason: { type: string, nullable: true }
        transferred_to_contract_id: { type: integer, nullable: true }
        transferred_from_contract_id: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ContractWrite:
      type: object
      required: [room_id, tenant_id, start_date, monthly_price, deposit_amount, status]
      properties:
        room_id: { type: integer }
        tenant_id: { type: integer }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        monthly_price: { type: number }
        deposit_amount: { type: number }
        status: { type: string, enum: [active, expired, cancelled] }

    ContractRenewRequest:
      type: object
      required: [new_end_date]
      properties:
        new_end_date: { type: string, format: date }
        new_monthly_price: { type: number }
        note: { type: string, nullable: true }

    ContractCheckoutRequest:
      type: object
      required: [checkout_at]
      properties:
        checkout_at: { type: string, format: date }
        deposit_refunded_amount: { type: number }
        deposit_deduction_reason: { type: string, nullable: true }

    ContractCheckoutResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id: { type: integer }
            status: { type: string }
            checkout_at: { type: string, format: date }
            deposit_refunded_amount: { type: number }
        suggested_refund: { type: number }
        unpaid_total: { type: number }

    ContractCancelRequest:
      type: object
      required: [cancel_reason, checkout_at]
      properties:
        cancel_reason: { type: string }
        checkout_at: { type: string, format: date }
        deposit_refunded_amount: { type: number }
        deposit_deduction_reason: { type: string, nullable: true }

    ContractTransferRoomRequest:
      type: object
      required: [new_room_id, transfer_at]
      properties:
        new_room_id: { type: integer }
        transfer_at: { type: string, format: date }
        new_monthly_price: { type: number }

    # ---------- Hoá đơn ----------
    InvoiceItem:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        amount: { type: number }

    InvoicePayment:
      type: object
      properties:
        id: { type: integer }
        invoice_id: { type: integer }
        amount: { type: number }
        paid_at: { type: string, format: date }
        payment_method: { type: string, enum: [tien_mat, chuyen_khoan, khac] }
        note: { type: string, nullable: true }
        status: { type: string, enum: [pending, approved] }
        approved_at: { type: string, format: date-time, nullable: true }
        approved_by: { type: string, nullable: true }
        created_by: { type: string, nullable: true }

    Invoice:
      type: object
      properties:
        id: { type: integer }
        contract_id: { type: integer }
        room_code: { type: string }
        building_id: { type: integer }
        month: { type: string, example: "2026-10" }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        room_price: { type: number }
        electric_start: { type: number }
        electric_end: { type: number }
        electric_unit_price: { type: number }
        electric_amount: { type: number, description: "(electric_end - electric_start) × electric_unit_price" }
        water_start: { type: number }
        water_end: { type: number }
        water_unit_price: { type: number }
        water_amount: { type: number }
        service_amount: { type: number, description: "Tổng phụ thu, cộng từ items" }
        total_amount: { type: number, description: "room_price + electric_amount + water_amount + service_amount" }
        amount_paid: { type: number }
        remaining: { type: number }
        status: { type: string, enum: [unpaid, partial, paid] }
        paid_at: { type: string, format: date-time, nullable: true }
        items: { type: array, items: { $ref: '#/components/schemas/InvoiceItem' } }
        payments: { type: array, items: { $ref: '#/components/schemas/InvoicePayment' } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    InvoiceWrite:
      type: object
      required: [contract_id, month, period_start, period_end, room_price]
      properties:
        contract_id: { type: integer }
        month: { type: string, format: date }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        room_price: { type: number }
        electric_start: { type: number }
        electric_end: { type: number }
        electric_unit_price: { type: number }
        water_start: { type: number }
        water_end: { type: number }
        water_unit_price: { type: number }
        service_amount: { type: number }

    InvoicePaymentCreate:
      type: object
      required: [amount, paid_at, payment_method]
      properties:
        amount: { type: number }
        paid_at: { type: string, format: date }
        payment_method: { type: string, enum: [tien_mat, chuyen_khoan, khac] }
        note: { type: string, nullable: true }

    InvoiceGenerateRequest:
      type: object
      required: [month]
      properties:
        month: { type: string, format: date }
        building_ids: { type: array, items: { type: integer } }

    InvoiceGenerateResponse:
      type: object
      properties:
        created_count: { type: integer }
        skipped_count: { type: integer }
        created:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              contract_id: { type: integer }
              room_code: { type: string }
              month: { type: string }
              total_amount: { type: number }
              status: { type: string }
        skipped:
          type: array
          items:
            type: object
            properties:
              contract_id: { type: integer }
              room_id: { type: integer }

    PaymentQrResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            qr_image: { type: string }
            checkout_url: { type: string }
            amount: { type: number }
            expired_at: { type: string, format: date-time }

    # ---------- Thu chi ----------
    Transaction:
      type: object
      properties:
        id: { type: integer }
        building_id: { type: integer }
        building_name: { type: string }
        room_code: { type: string, nullable: true }
        type: { type: string, enum: [thu, chi] }
        category: { type: string, nullable: true, enum: [sua_chua, van_hanh, hoan_coc, khac] }
        amount: { type: number }
        transaction_date: { type: string, format: date }
        is_auto: { type: boolean }
        contract_id: { type: integer, nullable: true }
        invoice_payment_id: { type: integer, nullable: true }
        note: { type: string, nullable: true }
        receipt_image: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TransactionWrite:
      type: object
      required: [building_id, type, amount, transaction_date]
      properties:
        building_id: { type: integer }
        contract_id: { type: integer, nullable: true }
        type: { type: string, enum: [thu, chi] }
        category: { type: string, nullable: true, enum: [sua_chua, van_hanh, hoan_coc, khac] }
        amount: { type: number }
        transaction_date: { type: string, format: date }
        note: { type: string, nullable: true }

    # ---------- Phụ thu ----------
    Surcharge:
      type: object
      properties:
        id: { type: integer }
        building_id: { type: integer }
        building_name: { type: string }
        name: { type: string }
        amount: { type: number }
        note: { type: string, nullable: true }
        is_active: { type: boolean }

    SurchargeWrite:
      type: object
      required: [building_id, name, amount]
      properties:
        building_id: { type: integer }
        name: { type: string }
        amount: { type: number }
        is_active: { type: boolean }

    # ---------- Nhắc việc ----------
    Reminder:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        content: { type: string, nullable: true }
        remind_date: { type: string, format: date }
        type: { type: string, enum: [thu_tien, het_han_hop_dong, bao_tri, khac] }
        room_id: { type: integer, nullable: true }
        room_code: { type: string, nullable: true }
        contract_id: { type: integer, nullable: true }
        is_done: { type: boolean }

    ReminderWrite:
      type: object
      required: [title, remind_date, type]
      properties:
        title: { type: string }
        content: { type: string, nullable: true }
        remind_date: { type: string, format: date }
        type: { type: string, enum: [thu_tien, het_han_hop_dong, bao_tri, khac] }
        room_id: { type: integer, nullable: true }
        contract_id: { type: integer, nullable: true }

    ReminderUpdate:
      type: object
      properties:
        is_done: { type: boolean }

    ReminderSendDueResponse:
      type: object
      properties:
        message: { type: string }
        data:
          type: object
          properties:
            total: { type: integer }
            new: { type: integer }
            repeat: { type: integer }

    # ---------- Thông báo (Announcement) ----------
    Announcement:
      type: object
      properties:
        id: { type: integer }
        building_id: { type: integer, nullable: true, description: "null = gửi TẤT CẢ khách thuê mọi toà" }
        building_name: { type: string, nullable: true }
        title: { type: string }
        body: { type: string }
        created_by: { type: string, nullable: true }
        created_by_name: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    AnnouncementWrite:
      type: object
      required: [title, body]
      properties:
        building_id: { type: integer, nullable: true }
        title: { type: string }
        body: { type: string }

    # ---------- Khai báo lưu trú ----------
    ResidenceDeclaration:
      type: object
      properties:
        id: { type: integer }
        contract_id: { type: integer }
        room_code: { type: string }
        tenant_id: { type: integer }
        full_name: { type: string }
        date_of_birth: { type: string, format: date }
        gender: { type: string }
        cccd_number: { type: string }
        nationality: { type: string }
        document_type: { type: string }
        phone_number: { type: string, nullable: true }
        checked_in_at: { type: string, format: date-time }
        checked_out_at: { type: string, format: date-time, nullable: true }
        room_number: { type: string }
        stay_address: { type: string }
        reason_for_stay: { type: string }
        custom_reason: { type: string, nullable: true }
        current_residence: { type: string }
        residence_type: { type: string }
        province: { type: string }
        ward: { type: string }
        address_detail: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        declared_at: { type: string, format: date-time, nullable: true }
        declared_by: { type: string, nullable: true }
        is_declared: { type: boolean }
        is_overdue: { type: boolean }
        is_data_complete: { type: boolean }
        missing_fields: { type: array, items: { type: string } }

    ResidenceDeclarationWrite:
      type: object
      required: [contract_id, tenant_id, full_name, checked_in_at, room_number, stay_address]
      properties:
        contract_id: { type: integer }
        tenant_id: { type: integer }
        full_name: { type: string }
        date_of_birth: { type: string, format: date }
        gender: { type: string }
        cccd_number: { type: string }
        nationality: { type: string }
        document_type: { type: string }
        checked_in_at: { type: string, format: date }
        room_number: { type: string }
        stay_address: { type: string }
        reason_for_stay: { type: string }
        current_residence: { type: string }
        residence_type: { type: string }
        province: { type: string }
        ward: { type: string }

    # ---------- Portal khách thuê ----------
    PortalTenant:
      type: object
      properties:
        id: { type: integer }
        fullname: { type: string }
        phone: { type: string }

    PortalAuthToken:
      type: object
      properties:
        token: { type: string }
        tenant: { $ref: '#/components/schemas/PortalTenant' }

    PortalOtpProfile:
      type: object
      properties:
        id: { type: integer }
        fullname: { type: string }
        room: { type: string }

    PortalOtpMultiProfileResponse:
      type: object
      properties:
        requires_selection: { type: boolean }
        selection_ticket: { type: string }
        profiles: { type: array, items: { $ref: '#/components/schemas/PortalOtpProfile' } }

    PortalDashboard:
      type: object
      properties:
        data:
          type: object
          properties:
            tenant: { $ref: '#/components/schemas/PortalTenant' }
            active_contract:
              type: object
              nullable: true
              properties:
                id: { type: integer }
                room_code: { type: string }
                building_name: { type: string }
                monthly_price: { type: number }
                start_date: { type: string, format: date }
                end_date: { type: string, format: date }
            unpaid_total: { type: number }
            unpaid_invoice_count: { type: integer }
            unread_notification_count: { type: integer }
            owner:
              type: object
              nullable: true
              properties:
                name: { type: string }
                phone: { type: string }
                address: { type: string }

    PortalNotification:
      type: object
      properties:
        id: { type: integer }
        type: { type: string, enum: [invoice_new, reminder, announcement, feedback_reply] }
        title: { type: string }
        body: { type: string, nullable: true }
        link: { type: string, nullable: true }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    PortalInvoiceListItem:
      type: object
      properties:
        id: { type: integer }
        month: { type: string, example: "11/2026" }
        room_code: { type: string }
        total_amount: { type: number }
        amount_paid: { type: number }
        remaining: { type: number }
        status: { type: string, enum: [unpaid, partial, paid] }

    PortalInvoiceDetail:
      allOf:
        - $ref: '#/components/schemas/PortalInvoiceListItem'
        - type: object
          properties:
            building_name: { type: string }
            room_price: { type: number }
            electric_amount: { type: number }
            electric_start: { type: number }
            electric_end: { type: number }
            water_amount: { type: number }
            water_start: { type: number }
            water_end: { type: number }
            items:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  amount: { type: number }

    PortalPayResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            qr_image: { type: string }
            open_url: { type: string, nullable: true }
            open_label: { type: string, nullable: true }
            amount: { type: number }
            expired_at: { type: string, format: date-time }

    PortalPayment:
      type: object
      properties:
        id: { type: integer }
        amount: { type: number }
        paid_at: { type: string, format: date }
        payment_method: { type: string, enum: [tien_mat, chuyen_khoan, khac] }
        status: { type: string, enum: [pending, approved] }
        note: { type: string, nullable: true }
        invoice_id: { type: integer }
        invoice_month: { type: string, example: "10/2026" }

    PortalContractListItem:
      type: object
      properties:
        id: { type: integer }
        status: { type: string, enum: [active, expired, cancelled] }
        room_code: { type: string }
        building_name: { type: string }
        monthly_price: { type: number }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }

    PortalContractDetail:
      allOf:
        - $ref: '#/components/schemas/PortalContractListItem'
        - type: object
          properties:
            deposit_amount: { type: number }
            checkout_at: { type: string, format: date, nullable: true }
            deposit_refunded_amount: { type: number, nullable: true }
            contract_content: { type: string, nullable: true }
            files:
              type: array
              items:
                type: object
                properties:
                  label: { type: string }
                  url: { type: string }

    PortalFeedbackWrite:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        content: { type: string, nullable: true }

    PortalPasswordWrite:
      type: object
      required: [password, password_confirmation]
      properties:
        password: { type: string, minLength: 6 }
        password_confirmation: { type: string }

    PortalPushTokenRegister:
      type: object
      required: [token]
      properties:
        token: { type: string, description: "Token FCM hoặc Expo (ExponentPushToken[...])" }
        platform: { type: string, nullable: true, enum: [web, android, ios] }

    PortalPushTokenUnregister:
      type: object
      required: [token]
      properties:
        token: { type: string }

paths:
  # ==================== 1. Xác thực Admin ====================
  /admin/login:
    post:
      tags: [Xác thực Admin]
      summary: Đăng nhập admin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLoginResponse' }
        '401':
          description: Sai email/mật khẩu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }

  /admin/logout:
    post:
      tags: [Xác thực Admin]
      summary: Đăng xuất admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }

  /admin/me:
    get:
      tags: [Xác thực Admin]
      summary: Thông tin tài khoản admin đang đăng nhập
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/AdminUser' }

  # ==================== 3. Toà nhà ====================
  /admin/minihouse/buildings:
    get:
      tags: [Toà nhà]
      summary: Danh sách toà nhà
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationMeta'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Building' } }
    post:
      tags: [Toà nhà]
      summary: Tạo toà nhà
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BuildingWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Building' } }

  /admin/minihouse/buildings/{id}:
    get:
      tags: [Toà nhà]
      summary: Chi tiết toà nhà
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Building' } }
        '404': { description: Không tìm thấy, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
    put:
      tags: [Toà nhà]
      summary: Cập nhật toà nhà (mọi field là sometimes)
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BuildingWrite' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Building' } }
    delete:
      tags: [Toà nhà]
      summary: Xoá toà nhà
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }

  # ==================== 4. Phòng ====================
  /admin/minihouse/rooms:
    get:
      tags: [Phòng]
      summary: Danh sách phòng
      parameters:
        - name: building_id
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string, enum: [trong, dat_coc, dang_thue, bao_tri] }
        - name: search
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { data: { type: array, items: { $ref: '#/components/schemas/Room' } } }
    post:
      tags: [Phòng]
      summary: Tạo phòng
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoomWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Room' } }

  /admin/minihouse/rooms/{id}:
    get:
      tags: [Phòng]
      summary: Chi tiết phòng
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Room' } }
    put:
      tags: [Phòng]
      summary: Cập nhật phòng
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoomWrite' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Room' } }
    delete:
      tags: [Phòng]
      summary: Xoá phòng
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }

  # ==================== 5. Số điện nước ====================
  /admin/minihouse/metering-readings:
    get:
      tags: [Số điện nước]
      summary: Danh sách log điện nước
      parameters:
        - name: room_id
          in: query
          schema: { type: integer }
        - name: month
          in: query
          schema: { type: string, example: "2026-10" }
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { data: { type: array, items: { $ref: '#/components/schemas/MeteringReading' } } }
    post:
      tags: [Số điện nước]
      summary: Tạo log điện nước tháng mới (electric_start/water_start server tự tính)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeteringReadingCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/MeteringReading' } }

  /admin/minihouse/metering-readings/{id}:
    get:
      tags: [Số điện nước]
      summary: Chi tiết log điện nước
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/MeteringReading' } }
    put:
      tags: [Số điện nước]
      summary: Cập nhật log (electric_end/water_end/note — tự đẩy chuỗi số kỳ sau)
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeteringReadingUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/MeteringReading' } }
    delete:
      tags: [Số điện nước]
      summary: Xoá log (từ chối nếu đã dùng để lập hoá đơn)
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '422':
          description: Log đã dùng để lập hoá đơn
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }

  # ==================== 6. Tiện ích ====================
  /admin/minihouse/amenities:
    get:
      tags: [Tiện ích]
      summary: Danh sách tiện ích
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { data: { type: array, items: { $ref: '#/components/schemas/Amenity' } } }
    post:
      tags: [Tiện ích]
      summary: Tạo tiện ích
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AmenityWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Amenity' } }

  /admin/minihouse/amenities/{id}:
    put:
      tags: [Tiện ích]
      summary: Cập nhật tiện ích
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AmenityWrite' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Amenity' } }
    delete:
      tags: [Tiện ích]
      summary: Xoá tiện ích
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }

  # ==================== 7. Khách thuê ====================
  /admin/minihouse/tenants:
    get:
      tags: [Khách thuê]
      summary: Danh sách khách thuê
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: room_id
          in: query
          schema: { type: integer }
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { data: { type: array, items: { $ref: '#/components/schemas/Tenant' } } }
    post:
      tags: [Khách thuê]
      summary: Tạo khách thuê
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Tenant' } }

  /admin/minihouse/tenants/{id}:
    get:
      tags: [Khách thuê]
      summary: Chi tiết khách thuê
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Tenant' } }
    put:
      tags: [Khách thuê]
      summary: Cập nhật khách thuê
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantWrite' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Tenant' } }
    delete:
      tags: [Khách thuê]
      summary: Xoá khách thuê
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }

  # ==================== 8. Hợp đồng ====================
  /admin/minihouse/contracts:
    get:
      tags: [Hợp đồng]
      summary: Danh sách hợp đồng
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [active, expired, cancelled] }
        - name: room_id
          in: query
          schema: { type: integer }
        - name: tenant_id
          in: query
          schema: { type: integer }
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { data: { type: array, items: { $ref: '#/components/schemas/Contract' } } }
    post:
      tags: [Hợp đồng]
      summary: Tạo hợp đồng
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContractWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Contract' } }
        '422':
          description: Phòng đang có hợp đồng khác còn hiệu lực
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }

  /admin/minihouse/contracts/{id}:
    get:
      tags: [Hợp đồng]
      summary: Chi tiết hợp đồng
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Contract' } }
    put:
      tags: [Hợp đồng]
      summary: Cập nhật hợp đồng
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContractWrite' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Contract' } }
    delete:
      tags: [Hợp đồng]
      summary: Xoá hợp đồng
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }

  /admin/minihouse/contracts/{id}/renew:
    post:
      tags: [Hợp đồng]
      summary: Gia hạn hợp đồng
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContractRenewRequest' }
      responses:
        '200':
          description: Hợp đồng đã cập nhật (như GET chi tiết)
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Contract' } }

  /admin/minihouse/contracts/{id}/checkout:
    post:
      tags: [Hợp đồng]
      summary: Thanh lý hợp đồng
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContractCheckoutRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractCheckoutResponse' }

  /admin/minihouse/contracts/{id}/cancel:
    post:
      tags: [Hợp đồng]
      summary: Huỷ hợp đồng sớm
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContractCancelRequest' }
      responses:
        '200':
          description: Cùng khuôn dạng checkout, status = cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractCheckoutResponse' }

  /admin/minihouse/contracts/{id}/transfer-room:
    post:
      tags: [Hợp đồng]
      summary: Chuyển phòng (tạo hợp đồng mới, đóng hợp đồng cũ)
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContractTransferRoomRequest' }
      responses:
        '201':
          description: Trả hợp đồng MỚI
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Contract' } }

  # ==================== 9. Hoá đơn ====================
  /admin/minihouse/invoices:
    get:
      tags: [Hoá đơn]
      summary: Danh sách hoá đơn
      parameters:
        - name: contract_id
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string, enum: [unpaid, partial, paid] }
        - name: month
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { data: { type: array, items: { $ref: '#/components/schemas/Invoice' } } }
    post:
      tags: [Hoá đơn]
      summary: Tạo hoá đơn (electric_amount/water_amount/total_amount server tự tính)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Invoice' } }
        '422':
          description: Hợp đồng đã có hoá đơn tháng đó
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }

  /admin/minihouse/invoices/{id}:
    get:
      tags: [Hoá đơn]
      summary: Chi tiết hoá đơn
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Invoice' } }
    put:
      tags: [Hoá đơn]
      summary: Cập nhật hoá đơn (tự tính lại total_amount)
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceWrite' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Invoice' } }
    delete:
      tags: [Hoá đơn]
      summary: Xoá hoá đơn
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }

  /admin/minihouse/invoices/generate:
    post:
      tags: [Hoá đơn]
      summary: Lập hoá đơn hàng loạt theo tháng
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceGenerateRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceGenerateResponse' }

  /admin/minihouse/invoices/{id}/qr:
    post:
      tags: [Hoá đơn]
      summary: Tạo mã QR thanh toán (VietQR)
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentQrResponse' }

  /admin/minihouse/invoices/{id}/momo:
    post:
      tags: [Hoá đơn]
      summary: Tạo link thanh toán MoMo
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentQrResponse' }

  /admin/minihouse/invoices/{id}/vnpay:
    post:
      tags: [Hoá đơn]
      summary: Tạo link thanh toán VNPay
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentQrResponse' }

