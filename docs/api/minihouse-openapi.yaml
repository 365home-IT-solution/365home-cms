  /minihouse/portal/otp/request:
    post:
      tags: [Portal - Xác thực]
      summary: Gửi mã OTP theo số điện thoại
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties: { phone: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  channel: { type: string, example: zalo }

  /minihouse/portal/otp/verify:
    post:
      tags: [Portal - Xác thực]
      summary: Xác thực mã OTP (trả token nếu 1 hồ sơ, hoặc yêu cầu chọn hồ sơ nếu nhiều)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string }
      responses:
        '200':
          description: OK — 1 trong 2 dạng tuỳ số hồ sơ tìm thấy
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PortalAuthToken'
                  - $ref: '#/components/schemas/PortalOtpMultiProfileResponse'

