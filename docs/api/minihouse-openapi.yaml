                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      status: { type: string }
                      approved_at: { type: string, format: date-time }
                      approved_by: { type: string }
                  invoice:
                    type: object
                    properties:
                      amount_paid: { type: number }
                      status: { type: string }
                      remaining: { type: number }

  /admin/minihouse/invoices/{invoiceId}/payments/{paymentId}:
