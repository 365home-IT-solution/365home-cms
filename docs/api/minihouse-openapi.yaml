      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [selection_ticket, tenant_id]
              properties:
                selection_ticket: { type: string }
                tenant_id: { type: integer }
      responses:
        '200':
          description: Cùng khuôn dạng token như otp/verify (1 hồ sơ)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalAuthToken' }

