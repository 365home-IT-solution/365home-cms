            schema: { $ref: '#/components/schemas/InvoicePaymentCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/InvoicePayment' }
