  # ===================================================================================
  #  D. WEBHOOK & KIỂM TRA
  # ===================================================================================
  /admin/partners/{partner}/pay2s-webhook:
    post:
      tags: [Webhook & kiểm tra]
      operationId: pay2sProvisionWebhook
      summary: Lấy token webhook tự động
      description: |
        Dành cho tài khoản `provider = pay2s` **chưa có token** (đã liên kết ở Pay2S bằng cách khác). Hệ thống tìm tài khoản trong danh sách của Pay2S theo số tài khoản,
        tạo webhook "Nhận tiền" rồi lưu token. Cách 1 và 2 đã tự làm bước này nên thường không cần gọi.

        - `created = true` ⇒ vừa tạo webhook mới. `has_webhook_token` cho biết đã có token chưa.
        - Pay2S chỉ trả token **một lần** lúc tạo. Webhook đã có mà hệ thống không giữ token ⇒ `422`, cần xoá webhook đó ở my.pay2s.vn rồi gọi lại (hệ thống không tự xoá).
        - Địa chỉ webhook phải gọi được từ internet (máy chủ nội bộ `.test` có thể bị Pay2S từ chối).
        Tối đa 10 lần / phút.
      parameters:
        - $ref: '#/components/parameters/partner'
        - $ref: '#/components/parameters/categoryIdQuery'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                category_id:
                  type: integer
                  nullable: true
                  description: Cũng nhận trong body (hoặc query).
      responses:
        '200':
          description: Đã tạo webhook và lưu token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      created:
                        type: boolean
                      has_webhook_token:
                        type: boolean
              example:
                message: Đã tạo webhook nhận tiền và lưu token.
                data:
                  created: true
                  has_webhook_token: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Đối tác chưa có tài khoản dùng cổng Pay2S ở phạm vi này.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Đối tác chưa có tài khoản nhận tiền dùng cổng Pay2S ở phạm vi này.
        '422':
          description: Không tạo được webhook (tài khoản không có ở Pay2S, không hoạt động, webhook đã có mà không giữ token, Pay2S từ chối...).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      created:
                        type: boolean
                      has_webhook_token:
                        type: boolean
              example:
                message: Pay2S đã có webhook cho tài khoản này nhưng token chỉ hiện một lần lúc tạo nên không lấy lại được. Xoá webhook đó ở my.pay2s.vn → Webhooks rồi bấm lại để tạo mới.
                data:
                  created: false
                  has_webhook_token: false
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /admin/partners/{partner}/pay2s-link-check:
    get:
      tags: [Webhook & kiểm tra]
      operationId: pay2sLinkCheck
      summary: Kiểm tra liên kết
      description: |
        Nút "Kiểm tra liên kết": tài khoản (mặc định hoặc `?category_id=`) đã đủ điều kiện nhận tiền tự động chưa.

        Các mục kiểm tra (`checks[].key`):
        - `provider` — cổng nhận tiền là Pay2S.
        - `active` — tài khoản đang bật.
        - `webhook_token` — đã có token webhook (không có ⇒ webhook bị từ chối).
        - `pay2s_linked` — Pay2S ghi nhận liên kết còn hoạt động (`ok = null` nếu chưa cấu hình khoá hoặc không hỏi được Pay2S).
        - `last_transaction` — giao dịch gần nhất đã xác nhận được đơn (`ok = null` nếu chưa có giao dịch; tài khoản mới liên kết là bình thường — chuyển thử 1 khoản nhỏ đúng nội dung).

        `linked = true` khi không mục nào `ok = false`.
      parameters:
        - $ref: '#/components/parameters/partner'
        - $ref: '#/components/parameters/categoryIdQuery'
      responses:
        '200':
          description: Kết quả kiểm tra.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LinkCheck'
              example:
                data:
                  linked: true
                  checks:
                    - key: provider
                      label: Cổng nhận tiền là Pay2S
                      ok: true
                      message: Đúng cổng Pay2S.
                    - key: active
                      label: Đang bật làm kênh thu tiền
                      ok: true
                      message: Đang bật.
                    - key: webhook_token
                      label: Có token webhook Pay2S
                      ok: true
                      message: Đã có token — webhook Pay2S gửi về sẽ được chấp nhận.
                    - key: pay2s_linked
                      label: Pay2S ghi nhận liên kết ngân hàng
                      ok: true
                      message: Pay2S báo tài khoản VA0988776655 đang liên kết.
                    - key: last_transaction
                      label: Giao dịch gần nhất xác nhận được đơn
                      ok: null
                      message: Chưa có giao dịch nào về (bình thường nếu tài khoản mới liên kết — chuyển thử 1 khoản nhỏ đúng nội dung để chắc chắn).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Đối tác chưa khai báo tài khoản nhận tiền.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Đối tác chưa khai báo tài khoản nhận tiền.
