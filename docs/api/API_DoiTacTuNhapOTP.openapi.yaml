        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Không có tài khoản nhận tiền ở phạm vi này.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Không có tài khoản nhận tiền ở phạm vi này.

  /admin/partners/{partner}/sepay-accounts:
